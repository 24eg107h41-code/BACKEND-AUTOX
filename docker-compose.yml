version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: autox-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autox
    ports:
      - "3306:3306"
    volumes:
      - autox_mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autox-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/autox?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      PORT: 8080
    depends_on:
      - mysql

volumes:
  autox_mysql_data:
